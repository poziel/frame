name: Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:library
      - run: bun run build:themes
      - run: bun run build:hosts
      - run: bun run check:modules
      - run: bun run check:consumer
      - run: bun run docs:contracts
      - run: bun test
      - name: Pack publishable manifests
        run: node scripts/pack-github.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_PRERELEASE: ${{ github.event_name == 'push' && format('dev.{0}.{1}', github.run_number, github.run_attempt) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: frame-packages
          path: dist/github-packages/*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        registry:
          - https://registry.npmjs.org
          - https://npm.pkg.github.com
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: ${{ matrix.registry }}
          scope: '@poziel'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: frame-packages
          path: packages
      - name: Publish packages
        run: |
          for package in ./packages/*.tgz; do
            npm publish "$package" --access public --tag "$PACKAGE_TAG" --registry="$PACKAGE_REGISTRY" "--@poziel:registry=$PACKAGE_REGISTRY"
          done
        env:
          NODE_AUTH_TOKEN: ${{ matrix.registry == 'https://npm.pkg.github.com' && secrets.GITHUB_TOKEN || '' }}
          PACKAGE_REGISTRY: ${{ matrix.registry }}
          PACKAGE_TAG: ${{ github.event_name == 'push' && 'next' || 'latest' }}
